name: Transformer offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  transformer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-transformer.txt
            requirements-crf.txt
      - run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-transformer.txt -r requirements-crf.txt
      - run: python -m unittest discover -s tests -v
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
